services:
  postgres:
    image: postgres:16-alpine
    container_name: safethrift_postgres
    environment:
      POSTGRES_USER: safethrift
      POSTGRES_PASSWORD: safethrift_dev_password
      POSTGRES_DB: safethrift_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U safethrift -d safethrift_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: safethrift_redis
    command: redis-server --appendonly yes --requirepass safethrift_dev_redis
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "safethrift_dev_redis", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: safethrift_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
